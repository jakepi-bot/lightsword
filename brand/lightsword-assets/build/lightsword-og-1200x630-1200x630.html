<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:#0B0E14; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          color:#F2F5FA; -webkit-font-smoothing:antialiased; }
  .field { position:absolute; inset:0; background:
      radial-gradient(120% 90% at 72% 20%, rgba(91,127,255,.20), rgba(91,127,255,0) 62%),
      radial-gradient(90% 70% at 8% 100%, rgba(91,127,255,.10), rgba(91,127,255,0) 60%),
      #0B0E14; }
  .grain { position:absolute; inset:0; opacity:.5; background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.022) 0 1px, transparent 1px 9px); }
  .mark { position:absolute; right:46px; top:50%; width:250px; height:250px; transform:translateY(-50%); }
  .mark svg { width:100%; height:100%; display:block; }
  .word {position:absolute; left:64px; top:50%; transform:translateY(-50%); width:760px;}
  .word .name { font-size:104px; font-weight:700; letter-spacing:-0.035em; line-height:.95; }
  .word .rule { height:6px; width:190px; background:#5B7FFF; border-radius:3px; margin:18px 0; margin-left:auto; }
  .word .tag { font-size:31px; font-weight:400; color:#9AA6BF; letter-spacing:-0.01em; line-height:1.25; }
  .corner { position:absolute; right:34px; bottom:34px; font-size:13px;
             color:#9AA6BF; letter-spacing:.16em; text-transform:uppercase; }
</style></head>
<body>
  <div class="field"></div><div class="grain"></div>
  <div class="mark"><svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<g>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DCE6FF"/>
      <stop offset="1" stop-color="#8FA9FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- blade: tip, straight edges, flat base -->
    <path d="M128 22 L147 64 L147 158 L109 158 L109 64 Z" fill="url(#beam)"/>
    <!-- fuller: the light core -->
    <path d="M128 38 L135 68 L135 150 L121 150 L121 68 Z" fill="#FFFFFF"/>
    <!-- crossguard -->
    <rect x="74" y="158" width="108" height="17" rx="7" fill="#E7ECF5"/>
    <!-- grip -->
    <rect x="117" y="175" width="22" height="46" rx="6" fill="#39415A"/>
    <!-- pommel -->
    <circle cx="128" cy="231" r="14" fill="#5B7FFF"/>
  </g>
</g>
</svg></div>
  <div class="word">
    <div class="name">Lightsword</div>
    <div class="rule"></div>
    <div class="tag">Every claim links a source</div>
  </div>
  lightsword.org
</body></html>
